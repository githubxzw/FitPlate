version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: fitplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitplate
      POSTGRES_PASSWORD: fitplate
      POSTGRES_DB: fitplate
    ports:
      - "5432:5432"
    volumes:
      - fitplate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitplate"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fitplate_pgdata:
